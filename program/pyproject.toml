[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true  # искать пакеты здесь только если явно указано в [sources]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[project]
name = "PTZ-Detector"
version = "0.1.0"       
requires-python = ">=3.12,<3.13"
dependencies = [
    "argostranslate>=1.11.0",
    "ffmpeg>=1.4",
    "numpy>=2.4.3",
    "opencv-python>=4.13.0.92",
    "pyserial>=3.5",
    "ru-word2number>=1.1",
    "sounddevice>=0.5.5",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "ultralytics>=8.4.41",
    "vosk>=0.3.45",
]
